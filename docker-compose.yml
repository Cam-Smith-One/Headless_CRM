services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: headless
      POSTGRES_PASSWORD: headless
      POSTGRES_DB: headless_crm
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U headless -d headless_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://headless:headless@postgres:5432/headless_crm
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: "3001"
      ATTACHMENTS_STORAGE: ${ATTACHMENTS_STORAGE:-disk}
      ATTACHMENTS_DIR: ${ATTACHMENTS_DIR:-/data/attachments}
      ATTACHMENTS_MAX_BYTES: ${ATTACHMENTS_MAX_BYTES:-10485760}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-crm@headless-crm.dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - attachments:/data/attachments

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://headless:headless@postgres:5432/headless_crm
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  attachments:
