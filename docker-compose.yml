services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: headless
      POSTGRES_PASSWORD: headless
      POSTGRES_DB: headless_crm
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U headless"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://headless:headless@postgres:5432/headless_crm
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: "3001"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-in-production}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-crm@headless-crm.dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
