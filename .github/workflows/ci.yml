name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: headless
          POSTGRES_PASSWORD: headless
          POSTGRES_DB: headless_crm
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U headless"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://headless:headless@localhost:5433/headless_crm
      JWT_SECRET: ci-test-secret
      ADMIN_API_KEY: ci-test-admin-key
      PORT: "3001"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Disable Corepack
        run: corepack disable || true

      - name: Clean npm install
        run: npm install --no-package-lock

      - name: Enable pgvector extension
        run: PGPASSWORD=headless psql -h localhost -p 5433 -U headless -d headless_crm -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database migrations
        run: npm run db:migrate

      - name: Build all packages
        run: npx turbo build

      - name: Lint
        run: npx turbo lint

      - name: Test
        run: npx turbo test
